services:
  mysql:
    image: mysql:8
    container_name: order_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: order_management
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: order_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: